<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Control — Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <style id="preload">body{visibility:hidden}</style>
    <script>
        if (sessionStorage.getItem('token')) {
            window.location.replace('dashboard.html');
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('preload').remove();
            });
        }
    </script>
</head>
<body>

<div class="card">
    <div class="brand">
        <div class="brand-icon">D&amp;D</div>
        <div class="brand-text">
            <h1>D&amp;D Control</h1>
            <p id="panel-subtitle">Panel de Administración</p>
        </div>
    </div>

    <p class="subtitle"></p>

    <div class="field">
        <label id="lbl-email"></label>
        <input type="email" id="email" autocomplete="email">
    </div>
    <div class="field">
        <label id="lbl-pass"></label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <p class="error-msg" id="errorMsg"></p>

    <button class="submit-btn" id="loginBtn" onclick="handleLogin()">
        <span id="btn-text"></span>
        <img src="icons/arrow-right-svgrepo-com.svg" alt="">
    </button>

    <p class="footer-note" id="footer-note"></p>

    <div class="lang-switcher-login">
        <button class="lang-btn-login" id="btn-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn-login" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
</div>

<script src="i18n.js"></script>
<script src="shared.js"></script>
<script>
    const texts = {
        es: { subtitle: 'Accede con tus credenciales de administrador para gestionar el control horario.', email: 'Correo electrónico', pass: 'Contraseña', btn: 'Iniciar sesión', footer: 'D&D Control v1.0 · Solo personal autorizado', panel: 'Panel de Administración' },
        en: { subtitle: 'Sign in with your administrator credentials to manage attendance control.', email: 'Email address', pass: 'Password', btn: 'Sign in', footer: 'D&D Control v1.0 · Authorised personnel only', panel: 'Administration Panel' }
    };

    function applyLoginLang() {
        const lang = sessionStorage.getItem('lang') || 'es';
        const tx = texts[lang];
        document.querySelector('.subtitle').textContent      = tx.subtitle;
        document.getElementById('lbl-email').textContent     = tx.email;
        document.getElementById('lbl-pass').textContent      = tx.pass;
        document.getElementById('btn-text').textContent      = tx.btn;
        document.getElementById('footer-note').textContent   = tx.footer;
        document.getElementById('panel-subtitle').textContent  = tx.panel;
        document.getElementById('btn-es').classList.toggle('active', lang === 'es');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    }

    applyLoginLang();

    async function handleLogin() {
        const email = document.getElementById('email').value.trim();
        const pass  = document.getElementById('password').value;
        const err   = document.getElementById('errorMsg');
        const btn   = document.getElementById('loginBtn');
        const lang  = sessionStorage.getItem('lang') || 'es';

        err.classList.remove('visible');

        if (!email || !pass) {
            err.textContent = lang === 'en' ? 'Please fill in all fields.' : 'Completa todos los campos.';
            err.classList.add('visible');
            return;
        }

        document.getElementById('btn-text').textContent = lang === 'en' ? 'Signing in…' : 'Accediendo…';
        btn.disabled = true;

        try {
            const res = await fetch(`${API}/auth/login`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email, password: pass })
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                err.textContent = errData.mensaje || errData.message || (lang === 'en' ? 'Incorrect credentials.' : 'Credenciales incorrectas.');
                err.classList.add('visible');
                document.getElementById('btn-text').textContent = texts[lang].btn;
                btn.disabled = false;
                return;
            }

            const data = await res.json();

            if (data.rol !== 'ADMIN') {
                err.textContent = lang === 'en' ? 'Access denied. Admins only.' : 'Acceso denegado. Solo administradores.';
                err.classList.add('visible');
                document.getElementById('btn-text').textContent = texts[lang].btn;
                btn.disabled = false;
                return;
            }

            sessionStorage.setItem('token',     data.token);
            sessionStorage.setItem('userId',    data.idUsuario);
            sessionStorage.setItem('empresaId', data.idEmpresa);
            sessionStorage.setItem('nombre',    `${data.nombre} ${data.apellidos}`);
            sessionStorage.setItem('rol',       data.rol);

            window.location.replace('dashboard.html');

        } catch {
            err.textContent = lang === 'en' ? 'Connection error.' : 'Error de conexión con el servidor.';
            err.classList.add('visible');
            document.getElementById('btn-text').textContent = texts[lang].btn;
            btn.disabled = false;
        }
    }

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
